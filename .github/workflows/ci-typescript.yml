name: TypeScript CI

on:
  push:
    branches: [main]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'
  pull_request:
    branches: [main]
    paths:
      - 'typescript/**'
      - '.github/workflows/ci-typescript.yml'

defaults:
  run:
    working-directory: typescript

jobs:
  # Local-if-idle: use an org `local` self-hosted runner (nus-cee pool on topc-ubuntu1)
  # when one is online+idle, else ubuntu-latest. Missing/invalid ORG_RUNNER_PAT
  # (org secret) degrades gracefully to ubuntu-latest — all-GitHub-hosted behavior.
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.ORG_RUNNER_PAT }}
        run: |
          if idle=$(gh api orgs/nus-cee/actions/runners --paginate \
               --jq '[.runners[] | select(.labels[].name=="local") | select(.status=="online" and .busy==false)] | length' 2>/dev/null) \
             && [ "$idle" -gt 0 ]; then
            echo 'labels=["self-hosted","local"]' >> "$GITHUB_OUTPUT"
          else
            echo 'labels=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  typecheck-test-build:
    needs: [pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage to GitHub Actions
        uses: actions/upload-artifact@v5
        with:
          name: typescript-coverage
          path: typescript/coverage/
