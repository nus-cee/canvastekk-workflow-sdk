name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog and determine next version
        id: git-cliff
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --bump
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Bump version in ALL language configs
        if: steps.git-cliff.outputs.version != ''
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: python3 scripts/bump_versions.py "${NEW_VERSION}"

      - name: Set up Python
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        run: pip install poetry==1.8.5

      - name: Update poetry.lock
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        run: poetry lock

      - name: Commit, tag and push
        if: steps.git-cliff.outputs.version != ''
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          for f in python/pyproject.toml python/poetry.lock \
                   python/canvastekk_workflow_sdk/__init__.py \
                   typescript/package.json typescript/package-lock.json \
                   typescript/src/version.ts \
                   dotnet/Directory.Build.props; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(release): prepare ${NEW_VERSION}"
          git tag "${NEW_VERSION}"
          git push
          git push --tags

      - name: Create GitHub Release
        if: steps.git-cliff.outputs.version != ''
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          CURRENT_NOTES=$(awk "/^## \[${NEW_VERSION#v}\]/,/^## \[/ { print }" CHANGELOG.md | head -n -1)
          echo "$CURRENT_NOTES" > /tmp/release-notes.md

          gh release create "${NEW_VERSION}" \
            --title "${NEW_VERSION}" \
            --notes-file /tmp/release-notes.md

      - name: Build and upload Python SDK to GitHub Release
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          # Assert we are building from the tagged commit (prevents stale wheel bug [DA-1302])
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "${NEW_VERSION}^{commit}" 2>/dev/null || echo "")
          if [ -n "${TAG_SHA}" ] && [ "${HEAD_SHA}" != "${TAG_SHA}" ]; then
            echo "ERROR: HEAD (${HEAD_SHA}) does not match tag ${NEW_VERSION} (${TAG_SHA})" >&2
            exit 1
          fi
          echo "Building from tagged commit ${HEAD_SHA} (${NEW_VERSION})"

          # Clean dist/ to prevent stale artifacts from previous builds
          rm -rf dist/

          # Build wheel from the tagged commit
          poetry build

          # Verify the built wheel contains expected symbols (prevents stale wheel bug [DA-1302])
          echo "Verifying wheel contents..."
          WHEEL_FILE=$(ls dist/*.whl)
          python3 -c "
          import zipfile, sys
          with zipfile.ZipFile('${WHEEL_FILE}') as z:
              def_path = [n for n in z.namelist() if n.endswith('definition.py')][0]
              source = z.read(def_path).decode()
              for symbol in ['WorkflowNodeManifest', 'WorkflowNodeStyles', 'WorkflowNodeRole']:
                  if symbol not in source:
                      print(f'FAIL: {symbol} not found in wheel definition.py', file=sys.stderr)
                      sys.exit(1)
              print('Pre-upload verification passed: all expected symbols present in wheel')
          "

          # Generate SHA256 hash for provenance attestation
          sha256sum "${WHEEL_FILE}" > "${WHEEL_FILE}.sha256"

          # Upload wheel and hash (use --clobber to replace any existing asset)
          gh release upload "${NEW_VERSION}" dist/*.whl dist/*.whl.sha256 --clobber

      - name: Pre-publish smoke test (local wheel install)
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        run: |
          python3 -m venv /tmp/pre-publish-venv
          WHEEL_FILE=$(ls dist/*.whl)
          /tmp/pre-publish-venv/bin/pip install "${WHEEL_FILE}"

          /tmp/pre-publish-venv/bin/python -c "
          from canvastekk_workflow_sdk import (
              WorkflowNodeManifest, WorkflowNodeStyles, WorkflowNodeRole,
              RetryConfig, BaseNode, ExecutionContext,
          )
          from canvastekk_workflow_sdk.workflow.models import (
              WorkflowDefinitionNode, WorkflowEdgeDefinition, WorkflowDefinitionSpec,
          )
          print('Pre-publish smoke test passed: wheel installs and imports correctly')
          "

      - name: Publish Python SDK to GitHub Packages
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        continue-on-error: true
        working-directory: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install twine
          python -m twine upload \
            --repository-url "https://pypi.pkg.github.com/nus-cee/" \
            --username "nus-cee" \
            --password "${GITHUB_TOKEN}" \
            --disable-progress-bar \
            dist/canvastekk_workflow_sdk-*.whl

      - name: Verify published wheel (post-publish smoke test)
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        continue-on-error: true
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NUM="${NEW_VERSION#v}"

          # Create clean virtualenv
          python3 -m venv /tmp/verify-venv

          # Install from GitHub Packages with auth + retry for propagation latency
          INDEX_URL="https://nus-cee:${GITHUB_TOKEN}@pypi.pkg.github.com/nus-cee/"
          INSTALL_SUCCESS=false
          for i in 1 2 3; do
            if /tmp/verify-venv/bin/pip install \
              "canvastekk-workflow-sdk==${VERSION_NUM}" \
              --index-url "${INDEX_URL}"; then
              INSTALL_SUCCESS=true
              break
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$INSTALL_SUCCESS" = false ]; then
            echo "::error::Failed to install canvastekk-workflow-sdk==${VERSION_NUM} after 3 attempts"
            exit 1
          fi

          # Verify all canonical names import correctly from published wheel
          /tmp/verify-venv/bin/python -c "
          from canvastekk_workflow_sdk import (
              WorkflowNodeManifest, WorkflowNodeStyles, WorkflowNodeRole,
              RetryConfig, BaseNode, ExecutionContext,
          )

          from canvastekk_workflow_sdk.workflow.models import (
              WorkflowDefinitionNode, WorkflowEdgeDefinition, WorkflowDefinitionSpec,
          )

          print('Post-publish verification passed: all canonical names resolve correctly')
          "

      # ─── TypeScript SDK: Build + Publish ───────────────────────────

      - name: Set up Node.js
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nus-cee'

      - name: Install TypeScript dependencies
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        working-directory: typescript
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript SDK
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        working-directory: typescript
        run: npm run build

      - name: Publish TypeScript SDK to GitHub Packages
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        continue-on-error: true
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Verify published TypeScript package
        if: steps.git-cliff.outputs.version != '' && hashFiles('typescript/package.json') != ''
        continue-on-error: true
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NUM="${NEW_VERSION#v}"
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"

          npm init -y > /dev/null 2>&1
          echo "@nus-cee:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc

          npm install "@nus-cee/canvastekk-workflow-sdk@${VERSION_NUM}" --legacy-peer-deps 2>&1

          node -e "
          const { VERSION, WorkflowBuilder, ResolverError } = require('@nus-cee/canvastekk-workflow-sdk');
          if (VERSION !== '${VERSION_NUM}') {
            console.error('Version mismatch: expected ${VERSION_NUM}, got ' + VERSION);
            process.exit(1);
          }
          console.log('Post-publish TS verification passed: version ' + VERSION + ' resolved correctly');
          "
