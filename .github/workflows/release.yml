name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog and determine next version
        id: git-cliff
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --bump
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Detect changed language directories
        id: detect
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          if [ -z "$NEW_VERSION" ]; then
            echo "No version bump detected, skipping."
            exit 0
          fi

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          BASE_REF="${PREV_TAG:-HEAD^}"

          echo "Comparing against: $BASE_REF"

          changed_dirs=""
          for dir in python typescript dotnet; do
            if [ -d "$dir" ]; then
              if git diff --name-only "$BASE_REF" HEAD -- "$dir/" | grep -q .; then
                changed_dirs="$changed_dirs $dir"
                echo "$dir changed: yes"
              else
                echo "$dir changed: no"
              fi
            fi
          done

          echo "changed_dirs=$changed_dirs" >> "$GITHUB_OUTPUT"

      - name: Bump version in changed language configs
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
          CHANGED_DIRS: ${{ steps.detect.outputs.changed_dirs }}
        run: |
          if [ -z "$NEW_VERSION" ]; then
            exit 0
          fi

          version="${NEW_VERSION#v}"

          python3 << EOF
          import os

          version = os.environ.get("version", "")
          changed_dirs = os.environ.get("CHANGED_DIRS", "").strip().split()

          version_files = {
              "python": "python/pyproject.toml",
              "typescript": "typescript/package.json",
              "dotnet": "dotnet/Directory.Build.props",
          }

          for lang_dir in changed_dirs:
              lang = lang_dir.strip()
              if not lang:
                  continue
              path = version_files.get(lang)
              if not path or not os.path.exists(path):
                  print(f"SKIP: {lang} — no version file found at {path}")
                  continue

              with open(path, "r") as f:
                  lines = f.readlines()

              if path.endswith(".toml"):
                  with open(path, "w") as f:
                      for line in lines:
                          stripped = line.strip()
                          key = stripped.split("=", 1)[0].strip()
                          if key == "version" and stripped.startswith("version"):
                              f.write(f'version = "{version}"\n')
                          else:
                              f.write(line)
                  print(f"BUMPED: {path} -> {version}")
              elif path.endswith(".json"):
                  import json
                  data = json.loads("".join(lines))
                  data["version"] = version
                  with open(path, "w") as f:
                      json.dump(data, f, indent=2)
                      f.write("\n")
                  print(f"BUMPED: {path} -> {version}")
          EOF

      - name: Commit, tag and push
        id: commit
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          if [ -z "$NEW_VERSION" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          for f in python/pyproject.toml typescript/package.json dotnet/Directory.Build.props; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(release): prepare ${NEW_VERSION}"
          git tag "${NEW_VERSION}"
          git push
          git push --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          if [ -z "$NEW_VERSION" ]; then
            exit 0
          fi
          gh release create "${NEW_VERSION}" \
            --title "${NEW_VERSION}" \
            --notes-file CHANGELOG.md

      - name: Set up Python 3.12
        if: contains(steps.detect.outputs.changed_dirs, 'python')
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Publish Python SDK to GitHub Packages
        if: contains(steps.detect.outputs.changed_dirs, 'python')
        working-directory: python
        run: |
          pip install poetry
          poetry config http-basic.github "__token__" "${{ secrets.GITHUB_TOKEN }}"
          poetry build
          poetry publish --repository github
