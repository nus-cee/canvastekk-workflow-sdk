name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog and determine next version
        id: git-cliff
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --bump
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Bump version in ALL language configs
        if: steps.git-cliff.outputs.version != ''
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          export version="${NEW_VERSION#v}"

          python3 << 'PYEOF'
          import os, json, re

          version = os.environ["version"]

          version_files = {
              "python": "python/pyproject.toml",
              "python_init": "python/canvastekk_workflow_sdk/__init__.py",
              "typescript": "typescript/package.json",
              "dotnet": "dotnet/Directory.Build.props",
          }

          bumped = []

          for lang, path in version_files.items():
              if not os.path.exists(path):
                  print(f"SKIP: {lang} — {path} does not exist")
                  continue

              with open(path, "r") as f:
                  content = f.read()

              if path.endswith(".py"):
                  new_content, count = re.subn(
                      r'__version__\s*=\s*"[^"]*"',
                      f'__version__ = "{version}"',
                      content,
                      count=1,
                  )
                  with open(path, "w") as f:
                      f.write(new_content)
                  bumped.append(lang)
                  print(f"BUMPED: {path} -> {version}")

              elif path.endswith(".toml"):
                  new_content, count = re.subn(
                      r'(\[tool\.poetry\][^\[]*?)version\s*=\s*"[^"]*"',
                      rf'\1version = "{version}"',
                      content,
                      flags=re.DOTALL,
                  )
                  if count == 0:
                      new_content, count = re.subn(
                          r'version\s*=\s*"[^"]*"',
                          f'version = "{version}"',
                          content,
                          count=1,
                      )
                  with open(path, "w") as f:
                      f.write(new_content)
                  bumped.append(lang)
                  print(f"BUMPED: {path} -> {version}")

              elif path.endswith(".json"):
                  data = json.loads(content)
                  data["version"] = version
                  with open(path, "w") as f:
                      json.dump(data, f, indent=2)
                      f.write("\n")
                  bumped.append(lang)
                  print(f"BUMPED: {path} -> {version}")

              elif path.endswith(".props"):
                  import xml.etree.ElementTree as ET
                  tree = ET.parse(path)
                  root = tree.getroot()
                  for elem in root.iter("Version"):
                      elem.text = version
                  tree.write(path, xml_declaration=True, encoding="utf-8")
                  bumped.append(lang)
                  print(f"BUMPED: {path} -> {version}")

          if not bumped:
              print("WARNING: No version files were bumped!")
          PYEOF

      - name: Set up Python
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        run: pip install poetry

      - name: Update poetry.lock
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        run: poetry lock

      - name: Commit, tag and push
        if: steps.git-cliff.outputs.version != ''
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          for f in python/pyproject.toml python/poetry.lock \
                   python/canvastekk_workflow_sdk/__init__.py \
                   typescript/package.json typescript/package-lock.json \
                   dotnet/Directory.Build.props; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(release): prepare ${NEW_VERSION}"
          git tag "${NEW_VERSION}"
          git push
          git push --tags

      - name: Create GitHub Release
        if: steps.git-cliff.outputs.version != ''
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          CURRENT_NOTES=$(awk "/^## \[${NEW_VERSION#v}\]/,/^## \[/ { print }" CHANGELOG.md | head -n -1)
          echo "$CURRENT_NOTES" > /tmp/release-notes.md

          gh release create "${NEW_VERSION}" \
            --title "${NEW_VERSION}" \
            --notes-file /tmp/release-notes.md

      - name: Build and upload Python SDK to GitHub Release
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          # Assert we are building from the tagged commit (prevents stale wheel bug [DA-1302])
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "${NEW_VERSION}^{commit}" 2>/dev/null || echo "")
          if [ -n "${TAG_SHA}" ] && [ "${HEAD_SHA}" != "${TAG_SHA}" ]; then
            echo "ERROR: HEAD (${HEAD_SHA}) does not match tag ${NEW_VERSION} (${TAG_SHA})" >&2
            exit 1
          fi
          echo "Building from tagged commit ${HEAD_SHA} (${NEW_VERSION})"

          # Clean dist/ to prevent stale artifacts from previous builds
          rm -rf dist/

          # Build wheel from the tagged commit
          poetry build

          # Verify the built wheel contains expected symbols (prevents stale wheel bug [DA-1302])
          echo "Verifying wheel contents..."
          WHEEL_FILE=$(ls dist/*.whl)
          python3 -c "
          import zipfile, sys
          with zipfile.ZipFile('${WHEEL_FILE}') as z:
              def_path = [n for n in z.namelist() if n.endswith('definition.py')][0]
              source = z.read(def_path).decode()
              for symbol in ['WorkflowNodeManifest', 'WorkflowNodeStyles', 'WorkflowNodeRole']:
                  if symbol not in source:
                      print(f'FAIL: {symbol} not found in wheel definition.py', file=sys.stderr)
                      sys.exit(1)
              print('Pre-upload verification passed: all expected symbols present in wheel')
          "

          # Generate SHA256 hash for provenance attestation
          sha256sum "${WHEEL_FILE}" > "${WHEEL_FILE}.sha256"

          # Upload wheel and hash (use --clobber to replace any existing asset)
          gh release upload "${NEW_VERSION}" dist/*.whl dist/*.whl.sha256 --clobber

      - name: Verify published wheel (post-publish smoke test)
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          VERSION_NUM="${NEW_VERSION#v}"

          # Create clean virtualenv
          python3 -m venv /tmp/verify-venv

          # Install from GitHub Packages (simulates real consumer experience)
          /tmp/verify-venv/bin/pip install \
            "canvastekk-workflow-sdk==${VERSION_NUM}" \
            --index-url "https://pypi.pkg.github.com/nus-cee/"

          # Verify all canonical names import correctly from published wheel
          /tmp/verify-venv/bin/python -c "
          from canvastekk_workflow_sdk import (
              WorkflowNodeManifest, WorkflowNodeStyles, WorkflowNodeRole,
              RetryConfig, BaseNode, ExecutionContext,
          )

          # Verify workflow model canonical names
          from canvastekk_workflow_sdk.workflow.models import (
              WorkflowDefinitionNode, WorkflowEdgeDefinition, WorkflowDefinitionSpec,
          )

          print('Post-publish verification passed: all canonical names resolve correctly')
          "
