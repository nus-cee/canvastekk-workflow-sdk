name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog and determine next version
        id: git-cliff
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --bump
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Bump version in ALL language configs
        if: steps.git-cliff.outputs.version != ''
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          export version="${NEW_VERSION#v}"

          python3 << 'PYEOF'
          import os, json, re

          version = os.environ["version"]

          version_files = {
              "python": "python/pyproject.toml",
              "typescript": "typescript/package.json",
              "dotnet": "dotnet/Directory.Build.props",
          }

          bumped = []

          for lang, path in version_files.items():
              if not os.path.exists(path):
                  print(f"SKIP: {lang} — {path} does not exist")
                  continue

              with open(path, "r") as f:
                  content = f.read()

              if path.endswith(".toml"):
                  new_content, count = re.subn(
                      r'(\[tool\.poetry\][^\[]*?)version\s*=\s*"[^"]*"',
                      rf'\1version = "{version}"',
                      content,
                      flags=re.DOTALL,
                  )
                  if count == 0:
                      new_content, count = re.subn(
                          r'version\s*=\s*"[^"]*"',
                          f'version = "{version}"',
                          content,
                          count=1,
                      )
                  with open(path, "w") as f:
                      f.write(new_content)
                  bumped.append(lang)
                  print(f"BUMPED: {path} -> {version}")

              elif path.endswith(".json"):
                  data = json.loads(content)
                  data["version"] = version
                  with open(path, "w") as f:
                      json.dump(data, f, indent=2)
                      f.write("\n")
                  bumped.append(lang)
                  print(f"BUMPED: {path} -> {version}")

              elif path.endswith(".props"):
                  import xml.etree.ElementTree as ET
                  tree = ET.parse(path)
                  root = tree.getroot()
                  for elem in root.iter("Version"):
                      elem.text = version
                  tree.write(path, xml_declaration=True, encoding="utf-8")
                  bumped.append(lang)
                  print(f"BUMPED: {path} -> {version}")

          if not bumped:
              print("WARNING: No version files were bumped!")
          PYEOF

      - name: Set up Python
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        run: pip install poetry

      - name: Update poetry.lock
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        run: poetry lock

      - name: Commit, tag and push
        if: steps.git-cliff.outputs.version != ''
        env:
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md
          for f in python/pyproject.toml python/poetry.lock \
                   typescript/package.json typescript/package-lock.json \
                   dotnet/Directory.Build.props; do
            [ -f "$f" ] && git add "$f"
          done

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore(release): prepare ${NEW_VERSION}"
          git tag "${NEW_VERSION}"
          git push
          git push --tags

      - name: Create GitHub Release
        if: steps.git-cliff.outputs.version != ''
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          CURRENT_NOTES=$(awk "/^## \[${NEW_VERSION#v}\]/,/^## \[/ { print }" CHANGELOG.md | head -n -1)
          echo "$CURRENT_NOTES" > /tmp/release-notes.md

          gh release create "${NEW_VERSION}" \
            --title "${NEW_VERSION}" \
            --notes-file /tmp/release-notes.md

      - name: Build and upload Python SDK to GitHub Release
        if: steps.git-cliff.outputs.version != '' && hashFiles('python/pyproject.toml') != ''
        working-directory: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          poetry build
          gh release upload "${NEW_VERSION}" dist/*
