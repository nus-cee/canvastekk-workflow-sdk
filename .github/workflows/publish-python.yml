name: Publish Python SDK

on:
  push:
    tags:
      - 'python-v*'

defaults:
  run:
    working-directory: python

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry for GitHub Packages
        run: poetry config http-basic.github "__token__" "${{ secrets.GITHUB_TOKEN }}"

      - name: Build package
        run: poetry build

      - name: Publish to GitHub Packages
        run: poetry publish --repository github
