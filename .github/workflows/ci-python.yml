name: Python CI

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/ci-python.yml'

defaults:
  run:
    working-directory: python

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint with Ruff
        run: poetry run ruff check canvastekk_workflow_sdk/ tests/

      - name: Run tests with coverage
        run: poetry run pytest -v --cov=canvastekk_workflow_sdk --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to GitHub Actions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: python-coverage
          path: python/coverage.xml
